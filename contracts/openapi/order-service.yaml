openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
  description: DeliveryHub Order Service - Delivery management API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8081
    description: Local Development
  - url: https://api.deliveryhub.example.com
    description: Production
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak OAuth2/OIDC JWT token
  schemas:
    CreateDeliveryRequest:
      type: object
      required:
        - pickupAddress
        - pickupLatitude
        - pickupLongitude
        - dropoffAddress
        - dropoffLatitude
        - dropoffLongitude
        - packageType
        - packageWeight
      properties:
        pickupAddress:
          type: string
          maxLength: 500
          example: "123 Main St, New York, NY"
        pickupLatitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 40.7128
        pickupLongitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -74.0060
        dropoffAddress:
          type: string
          maxLength: 500
          example: "456 Broadway, New York, NY"
        dropoffLatitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 40.7589
        dropoffLongitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -73.9851
        packageType:
          type: string
          maxLength: 50
          example: "DOCUMENTS"
        packageWeight:
          type: number
          format: double
          minimum: 0.01
          maximum: 1000
          example: 0.5
    CancelDeliveryRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 500
          example: "Customer cancelled"
    DeliveryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        pickupAddress:
          type: string
        pickupLatitude:
          type: number
          format: double
        pickupLongitude:
          type: number
          format: double
        dropoffAddress:
          type: string
        dropoffLatitude:
          type: number
          format: double
        dropoffLongitude:
          type: number
          format: double
        packageType:
          type: string
        packageWeight:
          type: number
          format: double
        status:
          type: string
          enum: [CREATED, ASSIGNING, ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED, CANCELLED]
        driverId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        traceId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
security:
  - bearerAuth: []
paths:
  /api/v1/deliveries:
    post:
      summary: Create a new delivery
      operationId: createDelivery
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: Idempotency key for safe retries
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryRequest'
      responses:
        '201':
          description: Delivery created
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
    get:
      summary: List deliveries for authenticated customer
      operationId: listDeliveries
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
        '401':
          description: Unauthorized
  /api/v1/deliveries/{id}:
    get:
      summary: Get delivery by ID
      operationId: getDelivery
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - not owner
        '404':
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/deliveries/{id}/cancel:
    post:
      summary: Cancel a delivery
      operationId: cancelDelivery
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDeliveryRequest'
      responses:
        '200':
          description: Delivery cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Delivery not found
        '409':
          description: Delivery cannot be cancelled in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'