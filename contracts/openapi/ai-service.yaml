openapi: 3.0.3
info:
  title: AI Service API
  version: 1.0.0
  description: DeliveryHub AI Service - ETA prediction, risk analysis, and AI assistant
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8085
    description: Local Development
  - url: https://api.deliveryhub.example.com
    description: Production
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ETAPredictionRequest:
      type: object
      required:
        - distance
        - driverDistance
        - averageSpeed
        - trafficLevel
        - packageWeight
      properties:
        distance:
          type: number
          format: double
          minimum: 0
          example: 5.2
        driverDistance:
          type: number
          format: double
          minimum: 0
          example: 2.1
        averageSpeed:
          type: number
          format: double
          minimum: 1
          maximum: 120
          example: 25.0
        trafficLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: "MEDIUM"
        packageWeight:
          type: number
          format: double
          minimum: 0
          example: 1.5
    ETAPredictionResponse:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        etaMinutes:
          type: integer
          example: 24
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.91
    RiskAnalysisRequest:
      type: object
      required:
        - driverDistance
        - trafficLevel
        - packageWeight
      properties:
        driverDistance:
          type: number
          format: double
          minimum: 0
          example: 2.1
        trafficLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: "MEDIUM"
        packageWeight:
          type: number
          format: double
          minimum: 0
          example: 1.5
        weatherCondition:
          type: string
          enum: [CLEAR, RAIN, SNOW, FOG]
          example: "CLEAR"
    RiskAnalysisResponse:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        risk:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: "MEDIUM"
        reasons:
          type: array
          items:
            type: string
          example:
            - "Driver is 6 km from pickup"
            - "Traffic level is high"
    AssistantRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          example: "Why is delivery 123 delayed?"
        context:
          type: object
          additionalProperties: true
    AssistantResponse:
      type: object
      properties:
        answer:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
security:
  - bearerAuth: []
paths:
  /api/v1/ai/deliveries/{id}/eta:
    post:
      summary: Predict ETA for a delivery
      operationId: predictETA
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ETAPredictionRequest'
      responses:
        '200':
          description: ETA prediction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ETAPredictionResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Delivery not found
  /api/v1/ai/deliveries/{id}/risk:
    post:
      summary: Analyze risk for a delivery
      operationId: analyzeRisk
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskAnalysisRequest'
      responses:
        '200':
          description: Risk analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAnalysisResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Delivery not found
  /api/v1/ai/assistant:
    post:
      summary: Ask AI assistant
      operationId: askAssistant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantRequest'
      responses:
        '200':
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized