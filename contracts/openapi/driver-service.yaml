openapi: 3.0.3
info:
  title: Driver Service API
  version: 1.0.0
  description: DeliveryHub Driver Service - Driver management API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8082
    description: Local Development
  - url: https://api.deliveryhub.example.com
    description: Production
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateDriverRequest:
      type: object
      required:
        - name
        - phone
        - vehicleType
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        phone:
          type: string
          minLength: 10
          maxLength: 50
        email:
          type: string
          format: email
        vehicleType:
          type: string
          enum: [MOTORCYCLE, CAR, BICYCLE, VAN, TRUCK]
        licensePlate:
          type: string
          maxLength: 20
    UpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [OFFLINE, AVAILABLE, RESERVED, BUSY]
    UpdateLocationRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          format: double
        heading:
          type: number
          format: double
        speed:
          type: number
          format: double
    DriverResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        vehicleType:
          type: string
        licensePlate:
          type: string
        status:
          type: string
          enum: [OFFLINE, AVAILABLE, RESERVED, BUSY]
        currentLatitude:
          type: number
          format: double
        currentLongitude:
          type: number
          format: double
        lastLocationUpdate:
          type: string
          format: date-time
        rating:
          type: number
          format: double
        totalDeliveries:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LocationResponse:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
security:
  - bearerAuth: []
paths:
  /api/v1/drivers:
    post:
      summary: Create a new driver
      operationId: createDriver
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '201':
          description: Driver created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '409':
          description: Driver with phone already exists
    get:
      summary: List drivers
      operationId: listDrivers
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of drivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  drivers:
                    type: array
                    items:
                      $ref: '#/components/schemas/DriverResponse'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          description: Unauthorized
  /api/v1/drivers/{id}:
    get:
      summary: Get driver by ID
      operationId: getDriver
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '401':
          description: Unauthorized
        '404':
          description: Driver not found
  /api/v1/drivers/{id}/status:
    patch:
      summary: Update driver status
      operationId: updateDriverStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Driver not found
        '409':
          description: Invalid status transition
  /api/v1/drivers/{id}/location:
    post:
      summary: Update driver location
      operationId: updateDriverLocation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Location updated
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Driver not found
    get:
      summary: Get driver location
      operationId: getDriverLocation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '401':
          description: Unauthorized
        '404':
          description: Location not found