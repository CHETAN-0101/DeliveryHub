apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: deliveryhub
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: deliveryhub
  labels:
    app: order-service
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
    - port: 9091
      targetPort: 9091
      protocol: TCP
      name: grpc
  selector:
    app: order-service
---
apiVersion: v1
kind: Service
metadata:
  name: driver-service
  namespace: deliveryhub
  labels:
    app: driver-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: grpc
  selector:
    app: driver-service
---
apiVersion: v1
