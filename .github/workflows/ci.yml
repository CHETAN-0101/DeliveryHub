name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # Java Services Build & Test
  # ===========================================
  java-build-test:
    name: Java Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/order-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Order Service
        run: ./mvnw clean package -DskipTests -B

      - name: Run Order Service Unit Tests
        run: ./mvnw test

      - name: Run Order Service Integration Tests
        run: ./mvnw verify -Pintegration

      - name: Upload Order Service Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-service-test-reports
          path: target/surefire-reports/

  java-notification-build-test:
    name: Java Notification Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Notification Service
        run: ./mvnw clean package -DskipTests -B

      - name: Run Notification Service Unit Tests
        run: ./mvnw test

      - name: Run Notification Service Integration Tests
        run: ./mvnw verify -Pintegration

      - name: Upload Notification Service Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-service-test-reports
          path: target/surefire-reports/

  # ===========================================
  # Go Services Build & Test
  # ===========================================
  go-build-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - driver-service
          - dispatch-service
          - ai-service
    defaults:
      run:
        working-directory: ./services/${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run linter
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

      - name: Run unit tests
        run: go test -v ./...

      - name: Build binary
        run: go build -o bin/${{ matrix.service }} ./cmd/*

  # ===========================================
  # Docker Build
  # ===========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [java-build-test, java-notification-build-test, go-build-test]
    strategy:
      matrix:
        service:
          - api-gateway
          - order-service
          - driver-service
          - dispatch-service
          - notification-service
          - ai-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Integration Tests
  # ===========================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose -f infra/docker-compose/docker-compose.yml up -d
          sleep 60

      - name: Run integration tests
        run: |
          # Wait for all services to be healthy
          for i in {1..30}; do
            if docker compose -f infra/docker-compose/docker-compose.yml ps | grep -q "unhealthy"; then
              echo "Some services unhealthy, waiting..."
              sleep 10
            else
              break
            fi
          done
          
          # Run API tests
          ./scripts/run-integration-tests.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose/docker-compose.yml logs > integration-test-logs.txt

      - name: Upload integration test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-logs
          path: integration-test-logs.txt

      - name: Cleanup
        if: always()
        run: |
          docker compose -f infra/docker-compose/docker-compose.yml down -v

  # ===========================================
  # Security Scan
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DeliveryHub'
          path: '.'
          format: 'HTML'
          out: 'reports'

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # ===========================================
  # End-to-End Test
  # ===========================================
  e2e-test:
    name: End-to-End Test
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run E2E tests
        run: |
          docker compose -f infra/docker-compose/docker-compose.yml up -d
          sleep 60
          ./scripts/run-e2e-tests.sh

      - name: Cleanup
        if: always()
        run: |
          docker compose -f infra/docker-compose/docker-compose.yml down -v

  # ===========================================
  # Deploy to Kubernetes (on main branch)
  # ===========================================
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [e2e-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f infra/kubernetes/
          kubectl rollout status deployment/api-gateway -n deliveryhub --timeout=300s
          kubectl rollout status deployment/order-service -n deliveryhub --timeout=300s
          kubectl rollout status deployment/driver-service -n deliveryhub --timeout=300s
          kubectl rollout status deployment/dispatch-service -n deliveryhub --timeout=300s
          kubectl rollout status deployment/notification-service -n deliveryhub --timeout=300s
          kubectl rollout status deployment/ai-service -n deliveryhub --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n deliveryhub
          kubectl get services -n deliveryhub